name: "Security Scanning"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  gosec:
    name: Go Security Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Track the latest 1.25 patch so govulncheck doesn't fail on known stdlib CVEs.
        go-version: '1.25.x'
        check-latest: true

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt sarif -out gosec-results.sarif -no-fail ./...

    - name: Fix SARIF format
      run: |
        # Fix the relationships array issue in SARIF output
        python3 << 'EOF'
        import json
        with open('gosec-results.sarif', 'r') as f:
            data = json.load(f)
        
        # Fix relationships field - remove null/invalid entries
        for run in data.get('runs', []):
            for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                if 'relationships' in rule:
                    # Filter out invalid relationship entries
                    valid_relationships = []
                    for rel in rule['relationships']:
                        if isinstance(rel, dict) and 'target' in rel:
                            valid_relationships.append(rel)
                    rule['relationships'] = valid_relationships if valid_relationships else None
                    # Remove if empty
                    if rule['relationships'] is None or len(rule['relationships']) == 0:
                        del rule['relationships']
        
        with open('gosec-results.sarif', 'w') as f:
            json.dump(data, f, indent=2)
        EOF

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Keep scanner runtime on the latest Go patch to avoid stdlib vulnerability findings.
        go-version: '1.25.x'
        check-latest: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...
